upstream jhamor_app {
 zone jhamor_app 64k;
 server jhamor-web:3012 resolve;
 keepalive 24;
}
server {
 listen 80;
 server_name jhamor.purprum.com;
 location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
 location / { return 308 https://$host$request_uri; }
}
server {
 listen 443 ssl;
 http2 on;
 server_name jhamor.purprum.com;
 ssl_certificate /etc/nginx/tls/jhamor.purprum.com/fullchain.pem;
 ssl_certificate_key /etc/nginx/tls/jhamor.purprum.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_session_cache shared:SSL:10m;
 ssl_session_timeout 1d;
 include /etc/nginx/conf.d/security.conf;
 gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/x-component;
 gzip_proxied any;
 location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
 location = /nginx-health { access_log off; return 200 'ok'; }
 location ~ ^/api/auth/(login|register)$ {
  limit_req zone=auth burst=15 nodelay;
  include /etc/nginx/conf.d/proxy.conf;
  proxy_pass http://jhamor_app;
 }
 location /_next/static/ {
  include /etc/nginx/conf.d/proxy.conf;
  proxy_pass http://jhamor_app;
  proxy_hide_header Cache-Control;
  add_header Cache-Control 'public, max-age=31536000, immutable' always;
 }
 location /media/ {
  include /etc/nginx/conf.d/proxy.conf;
  proxy_pass http://jhamor_app;
 }
 location / {
  include /etc/nginx/conf.d/proxy.conf;
  proxy_pass http://jhamor_app;
 }
}
