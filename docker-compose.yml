services:
  postgres:
    image: postgres:17-bookworm
    command:
      [
        postgres,
        -c,
        shared_preload_libraries=pg_stat_statements,
        -c,
        pg_stat_statements.track=all,
      ]
    restart: unless-stopped
    environment:
      POSTGRES_USER: jhamor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      POSTGRES_DB: jhamor
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:55433:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U jhamor -d jhamor"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      private:
        aliases: [jhamor-db]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://jhamor:${POSTGRES_PASSWORD}@jhamor-db:5432/jhamor?connection_limit=10&pool_timeout=10
      UPLOAD_DIR: /app/uploads
      SITE_URL: https://jhamor.purprum.com
      COOKIE_SECURE: "true"
    volumes:
      [
        uploads:/app/uploads,
        publication:/app/publication,
        image_cache:/app/.next/cache/images,
      ]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:3012/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
    networks:
      private:
      proxy:
        aliases: [jhamor-web]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
volumes:
  postgres_data:
  uploads:
  publication:
  image_cache:
networks:
  private:
  proxy:
    external: true
    name: auriel_internal
